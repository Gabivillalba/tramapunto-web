<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRAMA. — Definí tu contraseña</title>
<meta name="robots" content="noindex">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--black:#080808;--green:#C8FF1A;--white:#F4F4EF;--g1:#111;--muted:#666;--muted2:#999;--purple:#c084fc;--red:#ff4444}
html{scroll-behavior:smooth}
body{background:var(--black);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
nav{height:56px;padding:0 1.5rem;display:flex;align-items:center;background:rgba(8,8,8,.96);border-bottom:1px solid #1a1a1a}
.logo{font-size:1.2rem;font-weight:900;letter-spacing:.18em;color:var(--green);text-decoration:none}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem}
.box{background:var(--g1);border:1px solid #222;border-radius:3px;padding:2.25rem;width:100%;max-width:400px}
.tag{font-size:.6rem;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--green);margin-bottom:.5rem}
.h{font-size:1.3rem;font-weight:900;text-transform:uppercase;margin-bottom:.35rem}
.sub{font-size:.8rem;color:var(--muted2);margin-bottom:1.5rem;line-height:1.5}
.fg{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.875rem}
.fg label{font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fg input{background:#0d0d0d;border:1px solid #222;color:var(--white);padding:.65rem .875rem;font-size:.86rem;font-family:inherit;outline:none;border-radius:2px;transition:border-color .2s;width:100%}
.fg input:focus{border-color:var(--green)}
.fg input::placeholder{color:#444}
.btn{width:100%;background:var(--green);color:var(--black);border:none;padding:.8rem;font-weight:900;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-radius:2px;margin-top:.25rem;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:.73rem;padding:.55rem .875rem;border-radius:2px;margin-bottom:.875rem;display:none;line-height:1.5}
.msg.show{display:block}
.msg.err{color:var(--red);background:#1a0000;border:1px solid #2a0000}
.msg.ok{color:var(--green);background:#0f1a00;border:1px solid #2a4000}
.center{text-align:center}
.ic{font-size:2.5rem;margin-bottom:.75rem}
.link{display:inline-block;margin-top:1.25rem;background:var(--green);color:var(--black);padding:.75rem 1.5rem;font-weight:900;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border-radius:2px}
.link-ghost{display:inline-block;margin-top:1rem;color:var(--muted2);font-size:.75rem;text-decoration:none}
.link-ghost:hover{color:var(--white)}
</style>
</head>
<body>
<nav><a class="logo" href="/">TRAMA.</a></nav>
<div class="main">
  <div class="box" id="box">
    <div class="loading center" id="loading">
      <div class="sub">Verificando el enlace...</div>
    </div>
  </div>
</div>

<script>
const SB_URL  = 'https://mcpmabvxmdepastmpzbi.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jcG1hYnZ4bWRlcGFzdG1wemJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNDYwMDQsImV4cCI6MjA5NjkyMjAwNH0.4Sk9rKEtVjibczByGztgr_wOwyTH3c8XgOKtJHSzwRw';

// Supabase manda el token en el hash de la URL:
// #access_token=...&refresh_token=...&type=recovery
function parseHash(){
  const h = new URLSearchParams((location.hash||'').replace(/^#/,''));
  return {
    access_token: h.get('access_token'),
    type: h.get('type'),
    error: h.get('error_description') || h.get('error'),
  };
}

const box = document.getElementById('box');

function renderInvalido(motivo){
  box.innerHTML = `
    <div class="center">
      <div class="ic">⚠️</div>
      <div class="tag">Enlace inválido</div>
      <div class="h">No se pudo abrir</div>
      <div class="sub">${motivo||'El enlace venció o ya fue usado. Pedí uno nuevo desde "Olvidé mi contraseña".'}</div>
      <a class="link" href="/perfil.html">Ir a iniciar sesión →</a>
    </div>`;
}

function renderForm(){
  box.innerHTML = `
    <div class="tag">Acceso · TRAMA.</div>
    <div class="h">Definí tu contraseña</div>
    <div class="sub">Elegí una contraseña nueva para entrar a tu perfil.</div>
    <div class="msg" id="msg"></div>
    <div class="fg"><label>Contraseña nueva</label><input type="password" id="p1" placeholder="Mínimo 8 caracteres" autocomplete="new-password"></div>
    <div class="fg"><label>Repetir contraseña</label><input type="password" id="p2" placeholder="Repetí la contraseña" autocomplete="new-password"></div>
    <button class="btn" id="btn" onclick="guardar()">Guardar y entrar →</button>`;
  document.getElementById('p2').addEventListener('keydown',e=>{if(e.key==='Enter')guardar()});
}

function renderOk(){
  box.innerHTML = `
    <div class="center">
      <div class="ic">✅</div>
      <div class="tag">Listo</div>
      <div class="h">Contraseña definida</div>
      <div class="sub">Ya podés iniciar sesión en tu perfil con tu email y esta contraseña nueva.</div>
      <a class="link" href="/perfil.html">Ir a mi perfil →</a>
    </div>`;
}

function showMsg(txt,type){
  const m=document.getElementById('msg');
  if(!m)return;
  m.textContent=txt; m.className='msg show '+type;
}

let TOKEN = null;

async function guardar(){
  const p1=document.getElementById('p1').value;
  const p2=document.getElementById('p2').value;
  if(p1.length<8){ showMsg('La contraseña debe tener al menos 8 caracteres.','err'); return; }
  if(p1!==p2){ showMsg('Las contraseñas no coinciden.','err'); return; }

  const btn=document.getElementById('btn');
  btn.disabled=true; btn.textContent='Guardando...';
  try{
    // Con el access_token de recuperación, actualizamos la contraseña del usuario
    const r=await fetch(`${SB_URL}/auth/v1/user`,{
      method:'PUT',
      headers:{
        'apikey':SB_ANON,
        'Authorization':'Bearer '+TOKEN,
        'Content-Type':'application/json',
      },
      body:JSON.stringify({password:p1})
    });
    const d=await r.json().catch(()=>({}));
    if(!r.ok){
      throw new Error(d.msg||d.error_description||d.message||('Error '+r.status));
    }
    renderOk();
  }catch(e){
    showMsg('No se pudo guardar: '+e.message,'err');
    btn.disabled=false; btn.textContent='Guardar y entrar →';
  }
}

// INIT
(function(){
  const {access_token, type, error} = parseHash();
  if(error){ renderInvalido(decodeURIComponent(error)); return; }
  if(!access_token || type!=='recovery'){
    renderInvalido('El enlace no es válido o ya expiró. Pedí uno nuevo desde "Olvidé mi contraseña".');
    return;
  }
  TOKEN = access_token;
  // Limpiamos el hash de la URL para que el token no quede a la vista
  try{ history.replaceState(null,'',location.pathname); }catch(_){}
  renderForm();
})();
</script>
</body>
</html>
